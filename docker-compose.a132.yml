# A1.3.2 isolated Docker test environment.
# Do NOT use this file for production. Independent project name, ports,
# volumes and network to avoid any overlap with the production deployment.
services:
  deepanalyze-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepanalyze-a132:latest
    container_name: deepanalyze-a132-test
    ports:
      - "28888:8888"
      - "28501:8501"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-test-key-placeholder}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-a132-test-token}
      API_ENVIRONMENT: ${API_ENVIRONMENT:-production}
      API_ALLOW_INSECURE_AUTH: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:28501"
      MAX_CONCURRENT_AGENTS: "2"
      SESSION_TTL_HOURS: "24"
      FILE_SERVER_BASE: "http://localhost:28888"
      API_BASE_URL: "http://localhost:28888"
      START_MODE: "backend"
      # Runtime V2 stays disabled by default (A1.3.2 constraint).
      RUNTIME_V2_ENABLED: ""
    volumes:
      - ./workspace:/app/workspace
      - ./temp_uploads:/app/temp_uploads
    # Security hardening (A1.3.2.4 requirements).
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    cpus: 4.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
