name: smolagents
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip>=23.0

  # Core dependencies
  - pandas>=2.0.0
  - numpy>=1.24.0
  - openpyxl>=3.1.0
  - xlrd>=2.0.0

  # Visualization
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # Machine learning (optional)
  - scikit-learn>=1.4.0

  # Web frameworks
  - streamlit>=1.35.0
  - requests>=2.31.0

  # API server
  - fastapi>=0.110.0
  - uvicorn>=0.27.0

  # Utilities
  - pyyaml>=6.0
  - jinja2>=3.1.0
  - python-dotenv>=1.0.0
  - rich>=13.0.0

  # Install remaining packages via pip
  - pip:
    - huggingface-hub>=0.23.0
    - openai>=1.30.0
    - python-multipart>=0.0.9
