services:
  deepanalyze:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepanalyze:latest
    container_name: deepanalyze
    ports:
      - "18888:8888"   # FastAPI backend (host 18888 -> container 8888)
      - "18501:8501"   # Streamlit frontend (host 18501 -> container 8501)
    environment:
      # Required
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18501,http://127.0.0.1:18501}
      # Optional overrides (defaults match code)
      DEEPSEEK_MODEL_ID: ${DEEPSEEK_MODEL_ID:-deepseek-chat}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-3}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      # LLM request tuning (increase for slow on-prem models)
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-600}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-5}
      # Extra HTTP headers for internal API gateways (comma-separated key=val pairs)
      # e.g. LLM_EXTRA_HEADERS=ucid=usertest,Auth-Token=eyJ...
      LLM_EXTRA_HEADERS: ${LLM_EXTRA_HEADERS:-}
      # OpenAI-compatible gateways (for example internal Qwen/vLLM):
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      # Set false to send chat_template_kwargs.enable_thinking=false.
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-}
      # Optional JSON body fields passed through to the gateway.
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      # File server base URL shown to users. Set to the host's externally
      # reachable URL for the backend port (e.g. http://<host_ip>:8888).
      FILE_SERVER_BASE: ${FILE_SERVER_BASE:-http://localhost:8888}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8888}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-deepseek-chat}
      # both | backend | frontend
      START_MODE: ${START_MODE:-both}
    volumes:
      - ./langgraph_langchain:/app/langgraph_langchain
      - ./webui:/app/webui
      - ./workspace:/app/workspace
      - ./temp_uploads:/app/temp_uploads
    restart: unless-stopped
